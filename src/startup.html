<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw; height: 100vh;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
  }

  canvas#icon-canvas { display: block; opacity: 0; }

  #title {
    font-size: 72px; font-weight: 900;
    letter-spacing: 24px; color: #00a8ff;
    opacity: 0; margin-top: -4px;
    text-shadow: 0 0 40px rgba(0,168,255,0.6), 0 0 80px rgba(0,168,255,0.3);
  }

  #subtitle {
    font-size: 13px; letter-spacing: 8px;
    color: #8899aa; opacity: 0;
    margin-top: 8px; text-transform: uppercase;
  }

  #company {
    font-size: 10px; letter-spacing: 3px;
    color: #445566; opacity: 0;
    text-transform: uppercase; margin-top: 2px;
  }

  #divider {
    width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #00a8ff66, transparent);
    margin: 16px 0;
  }

  #boot {
    text-align: left; width: 360px;
    opacity: 0; min-height: 100px;
    position: absolute; bottom: 50px; left: 50px;
  }

  .boot-line {
    font-size: 11px; line-height: 2;
    opacity: 0; color: #445566;
  }
  .boot-line .ok { color: #00ff88; font-weight: 700; }
  .boot-line .ready { color: #00a8ff; font-weight: 700; }

  #version-tag {
    position: absolute; bottom: 20px; right: 24px;
    font-size: 10px; color: #223344;
    letter-spacing: 2px; opacity: 0;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px
    );
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<canvas id="icon-canvas" width="120" height="120"></canvas>
<div id="title">AVIS</div>
<div id="subtitle">Avel Intelligence Services</div>
<div id="company">by Avel Productions LLC</div>
<div id="divider"></div>

<div id="boot">
  <div class="boot-line" id="b1">&gt; INITIALIZING AVIS CORE <span class="ok">OK</span></div>
  <div class="boot-line" id="b2">&gt; LOADING AI PROVIDERS <span class="ok">OK</span></div>
  <div class="boot-line" id="b3">&gt; ESTABLISHING SECURE CHANNELS <span class="ok">OK</span></div>
  <div class="boot-line" id="b4">&gt; CHROME MCP BRIDGE <span class="ok">OK</span></div>
  <div class="boot-line" id="b5">&gt; CLAUDE ORCHESTRATOR <span class="ready">READY</span></div>
</div>

<div id="version-tag"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
const { ipcRenderer } = require('electron');

// Draw animated neural network icon on canvas
function drawIcon(canvas, progress, time) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2, r = W * 0.44;

  ctx.clearRect(0, 0, W, H);

  const nodes = [
    { x: cx,          y: cy - r * 0.55, s: W * 0.06 },
    { x: cx - r * 0.48, y: cy - r * 0.15, s: W * 0.045 },
    { x: cx + r * 0.48, y: cy - r * 0.15, s: W * 0.045 },
    { x: cx - r * 0.3,  y: cy + r * 0.42, s: W * 0.045 },
    { x: cx + r * 0.3,  y: cy + r * 0.42, s: W * 0.045 },
    { x: cx,          y: cy + r * 0.12, s: W * 0.075 },
  ];

  const edges = [[0,1],[0,2],[0,5],[1,3],[1,5],[2,4],[2,5],[3,5],[4,5],[3,4]];

  // Draw edges with pulsing
  edges.forEach(([a, b], i) => {
    const pulse = 0.25 + 0.75 * Math.abs(Math.sin(time * 1.5 + i * 0.7));
    ctx.beginPath();
    ctx.moveTo(nodes[a].x, nodes[a].y);
    ctx.lineTo(nodes[b].x, nodes[b].y);
    ctx.strokeStyle = `rgba(0,168,255,${pulse * 0.5 * progress})`;
    ctx.lineWidth = W * 0.008;
    ctx.stroke();
  });

  // Draw node glows then nodes
  nodes.forEach((n, i) => {
    const p = 0.7 + 0.3 * Math.sin(time * 1.2 + i * 1.1);
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.s * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,168,255,${0.07 * p * progress})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(n.x, n.y, n.s, 0, Math.PI * 2);
    ctx.fillStyle = i === 5
      ? `rgba(0,168,255,${p * progress})`
      : `rgba(0,100,220,${0.85 * p * progress})`;
    ctx.fill();
  });

  // Center "A" lettermark
  ctx.fillStyle = `rgba(255,255,255,${0.95 * progress})`;
  ctx.font = `900 ${W * 0.22}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('A', cx, cy + W * 0.04);
}

const canvas = document.getElementById('icon-canvas');
let iconProgress = 0;
const startTime = Date.now();

function animateIcon() {
  const t = (Date.now() - startTime) / 1000;
  drawIcon(canvas, iconProgress, t);
  requestAnimationFrame(animateIcon);
}
animateIcon();

// Play startup sound at 0.8s — path injected by main.js
setTimeout(() => {
  try {
    const audio = new Audio('{SOUND_PATH}');
    audio.volume = 0.7;
    audio.play().catch(() => {});
  } catch (e) {}
}, 800);

// GSAP timeline
const tl = gsap.timeline({
  onComplete: () => {
    setTimeout(() => ipcRenderer.send('startup-complete'), 600);
  }
});

tl
  // Icon fades in and scales up
  .to('#icon-canvas', {
    opacity: 1, duration: 0.6, ease: 'power2.out',
    onUpdate: function () { iconProgress = parseFloat(canvas.style.opacity) || 0; }
  })
  .from('#icon-canvas', {
    scale: 0.6, duration: 0.8, ease: 'back.out(1.7)'
  }, '<')

  // Title text
  .to('#title', { opacity: 1, duration: 0.5, ease: 'power2.out' }, '-=0.2')
  .from('#title', { y: 20, letterSpacing: '48px', duration: 0.6, ease: 'power3.out' }, '<')

  // Subtitle
  .to('#subtitle', { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, '-=0.1')
  .from('#subtitle', { y: 8 }, '<')

  // Company
  .to('#company', { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, '-=0.1')
  .from('#company', { y: 6 }, '<')

  // Divider line expands
  .to('#divider', { width: '360px', duration: 0.6, ease: 'power2.inOut' }, '-=0.2')

  // Version tag
  .to('#version-tag', { opacity: 1, duration: 0.3 }, '-=0.3')

  // Boot text container
  .to('#boot', { opacity: 1, duration: 0.2 })

  // Boot lines stagger in
  .to('#b1', { opacity: 1, duration: 0.15 })
  .to('#b2', { opacity: 1, duration: 0.15 }, '+=0.2')
  .to('#b3', { opacity: 1, duration: 0.15 }, '+=0.15')
  .to('#b4', { opacity: 1, duration: 0.15 }, '+=0.15')
  .to('#b5', { opacity: 1, duration: 0.15 }, '+=0.15')

  // Hold for a moment
  .to({}, { duration: 0.8 })

  // Fade out everything
  .to('body', { opacity: 0, duration: 0.5, ease: 'power2.in' });
</script>
</body>
</html>
