<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
      color: #00d4ff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #1a1a1a;
      margin-bottom: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
    .dot.disconnected { background: #ff4444; box-shadow: 0 0 6px #ff4444; }
    .label { font-size: 13px; }
    .info {
      font-size: 11px;
      color: #888;
      margin-top: 10px;
      line-height: 1.5;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: #00d4ff22;
      color: #00d4ff;
      border: 1px solid #00d4ff44;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #00d4ff33; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AVIS MCP</h1>
  </div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span class="label" id="statusText">Checking...</span>
  </div>
  <button id="reconnect">Reconnect</button>
  <div class="info">
    Bridge to AVIS on ws://localhost:10235<br>
    Start AVIS to enable browser automation.
  </div>
  <script src="popup.js"></script>
</body>
</html>
